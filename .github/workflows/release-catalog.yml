name: Release Plugin Catalog & Tarballs

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Run plugin tests
        run: npm test
      - name: Validate registry.json, partner metadata, & dist SHA-256
        run: node ./scripts/validate-registry.mjs
      - name: Pack plugins
        run: |
          mkdir -p packages
          for dir in plugins/*; do
            if [ -f "$dir/package.json" ]; then
              test -f "$dir/LICENSE" || { echo "missing LICENSE in $dir" >&2; exit 1; }
              tgz=$(npm pack "./$dir" --pack-destination ./packages | tail -n 1)
              tar -tzf "./packages/$tgz" | grep -qx "package/LICENSE" || {
                echo "packed tarball $tgz is missing package/LICENSE" >&2
                exit 1
              }
              if [ -f "$dir/THIRD_PARTY_NOTICES.md" ]; then
                tar -tzf "./packages/$tgz" | grep -qx "package/THIRD_PARTY_NOTICES.md" || {
                  echo "packed tarball $tgz is missing package/THIRD_PARTY_NOTICES.md" >&2
                  exit 1
                }
              fi
              test -f "./dist/$tgz" || {
                echo "missing committed tarball ./dist/$tgz" >&2
                exit 1
              }
              diff -u <(tar -tzf "./packages/$tgz" | LC_ALL=C sort) <(tar -tzf "./dist/$tgz" | LC_ALL=C sort) || {
                echo "committed dist/$tgz file list differs from freshly packed tarball" >&2
                exit 1
              }
              diff -u <(tar -xOzf "./packages/$tgz" package/package.json) <(tar -xOzf "./dist/$tgz" package/package.json) || {
                echo "committed dist/$tgz package.json is stale" >&2
                exit 1
              }
            fi
          done
          ls -lh packages/

  publish-release:
    needs: validate-and-pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure published GitHub Release with verified dist tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root_ver=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')
          tag="v${root_ver}"
          if rel_json=$(gh release view "$tag" --json isDraft,assets 2>/dev/null); then
            is_draft=$(node -e 'console.log(Boolean(JSON.parse(process.argv[1]).isDraft))' "$rel_json")
            if [ "$is_draft" = "true" ]; then
              gh release upload "$tag" dist/*.tgz --clobber
              gh release edit "$tag" --draft=false
            else
              mkdir -p /tmp/release-verify
              gh release download "$tag" -D /tmp/release-verify --pattern "*.tgz"
              for f in dist/*.tgz; do
                base=$(basename "$f")
                test -f "/tmp/release-verify/$base" || { gh release upload "$tag" "$f"; continue; }
                want=$(sha256sum "$f" | awk '{print $1}')
                got=$(sha256sum "/tmp/release-verify/$base" | awk '{print $1}')
                if [ "$want" != "$got" ]; then
                  echo "Refusing to overwrite published release asset $base (SHA mismatch $got != $want); bump package.json version instead" >&2
                  exit 1
                fi
              done
            fi
          else
            gh release create "$tag" dist/*.tgz --target "${GITHUB_SHA}" --title "$tag" --generate-notes
          fi
      - name: Purge jsDelivr @main registry cache
        run: |
          resp=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 15 "https://purge.jsdelivr.net/gh/Sunnyender-org/beeftv-plugins@main/registry.json") || {
            echo "::warning::jsDelivr purge request failed; clients fall back to GitHub raw and version freshness check"
            exit 0
          }
          echo "$resp"
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.status && data.status !== "finished" && data.status !== "queued") {
              console.warn("::warning::Unexpected jsDelivr purge status:", data.status);
            }
          ' "$resp"
      - name: Publish catalog and npm-listed plugins (if NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured; skipping npm publish (jsDelivr + GitHub Release tarballs remain active)."
            exit 0
          fi
          root_ver=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')
          if ! npm view "beeftv-plugin-catalog@${root_ver}" version >/dev/null 2>&1; then
            npm publish --access public
            curl -fsSL -X PUT https://registry-direct.npmmirror.com/beeftv-plugin-catalog/sync || true
          fi
          node -e '
            const reg = JSON.parse(require("fs").readFileSync("registry.json", "utf8"));
            for (const p of reg.plugins) {
              if (p.npm) console.log(`${p.packageName}\t${p.version}`);
            }
          ' | while IFS="$(printf "\t")" read -r pkg ver; do
            if ! npm view "${pkg}@${ver}" version >/dev/null 2>&1; then
              (cd "plugins/$pkg" && npm publish --access public)
              curl -fsSL -X PUT "https://registry-direct.npmmirror.com/${pkg}/sync" || true
            fi
          done
